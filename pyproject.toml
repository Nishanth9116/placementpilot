[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "placementpilot"
version = "0.1.0"
description = "Local AI placement preparation and campus drive tracking assistant powered by SQLite and the Model Context Protocol (MCP)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "PlacementPilot Team" }
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6.0",
    "starlette>=0.36.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
placementpilot = "src.mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

